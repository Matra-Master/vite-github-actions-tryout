name: Generate Test Suggestions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging  # Change this to your target branch
      # - develop  # Add more branches as needed

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to compare branches

      - name: Get PR diff
        id: diff
        run: |
          # Get the base and head commits
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Comparing $BASE_SHA...$HEAD_SHA"

          # Get the diff and save to file
          git diff "$BASE_SHA...$HEAD_SHA" > pr_changes.diff

          # Get list of changed files
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

      - name: Generate test suggestions
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/generate-tests.py

      - name: Post review comment
        if: steps.generate.outputs.has_suggestions == 'true'
        uses: actions/github-script@v7
        env:
          TEST_SUGGESTIONS: ${{ steps.generate.outputs.suggestions }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const suggestions = process.env.TEST_SUGGESTIONS;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_request_number: context.payload.pull_request.number,
              event: 'COMMENT',
              body: `## 🧪 Suggested Tests\n\n${suggestions}\n\n---\n*Generated automatically by GitHub Copilot*`
            });
